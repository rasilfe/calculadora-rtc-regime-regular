# Alertas da homologação. Sem Alertmanager: os alertas aparecem no Grafana
# (Alerting → Alert rules, fonte "Prometheus") e em http://localhost:9090/alerts.
groups:
  - name: rtc-calculadora
    rules:
      - alert: RtcWorkerFora
        expr: up{job="rtc-worker"} == 0
        for: 2m
        labels: { severidade: critica }
        annotations:
          resumo: "Worker sem responder às coletas há 2 min"

      - alert: RtcFilaSemConsumidores
        expr: rabbitmq_detailed_queue_consumers{queue=~`rtc\.(calculo|basecalculo)\.entrada`} == 0
        for: 2m
        labels: { severidade: critica }
        annotations:
          resumo: "{{ $labels.queue }} sem consumidores: nada dessa fila está sendo calculado"

      - alert: RtcMensagensNaDlq
        # strings PromQL entre crases são cruas: \. não precisa de escape duplo
        expr: rabbitmq_detailed_queue_messages_ready{queue=~`.*\.dlq`} > 0
        for: 1m
        labels: { severidade: alta }
        annotations:
          resumo: "{{ $value }} mensagem(ns) na {{ $labels.queue }}: ver motivo nos logs do worker"

      - alert: RtcFilaEntradaAcumulando
        expr: rabbitmq_detailed_queue_messages_ready{queue="rtc.calculo.entrada"} > 1000
        for: 10m
        labels: { severidade: media }
        annotations:
          resumo: "{{ $value }} notas esperando há mais de 10 min: o worker não acompanha a entrada"

      - alert: RtcErroTecnicoNoCalculo
        expr: increase(rtc_worker_notas_total{resultado="devolvida_fila"}[5m]) > 0
        labels: { severidade: alta }
        annotations:
          resumo: "Notas devolvidas à fila por erro técnico (banco, publicação ou CAL-999)"

      - alert: RtcRedisIndisponivel
        expr: increase(rtc_worker_idempotencia_indisponivel_total[5m]) > 0
        labels: { severidade: media }
        annotations:
          resumo: "Idempotência sem Redis: notas reentregues podem ser recalculadas"

      - alert: RtcRabbitAlarmeMemoria
        expr: max(rabbitmq_alarms_memory_used_watermark) == 1
        labels: { severidade: critica }
        annotations:
          resumo: "RabbitMQ no limite de memória: publicadores (empresas) bloqueados"

      - alert: RtcEmpresaNaoConsome
        expr: rabbitmq_detailed_queue_messages_ready{queue=~`rtc\.(calculo|basecalculo)\.saida\.[0-9A-Z]{12}[0-9]{2}`} > 5000
        for: 30m
        labels: { severidade: media }
        annotations:
          resumo: "Empresa {{ $labels.queue }} com {{ $value }} resultados não lidos há 30 min"

      - alert: RtcNoK3sMemoria
        expr: node_memory_MemAvailable_bytes{job="k3s-node"} / node_memory_MemTotal_bytes{job="k3s-node"} < 0.10
        for: 5m
        labels: { severidade: alta }
        annotations:
          resumo: "k3s-1 com menos de 10% de memória livre"
