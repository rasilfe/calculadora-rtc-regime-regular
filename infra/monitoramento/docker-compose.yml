# Monitoramento da homologação: Prometheus + Grafana na vm-apps (/data/tools/monitoramento).
# Coleta o worker e o RabbitMQ do k3s-1 pelos Services de k8s/ambientes/enxuto/metricas-lan.yaml
# e o node-exporter do k3s-1. O Grafana é publicado pelo Traefik da vm-infra em
# http://grafana.casa.lan (docs/traefik/grafana.yml).
#
#   cp .env.exemplo .env   # e troque a senha
#   docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: rtc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./dados/prometheus:/prometheus
    # só na própria vm-apps: o Grafana usa a rede interna do compose. Para a UI do
    # Prometheus: ssh -L 9090:localhost:9090 rasilfe@192.168.5.50 e http://localhost:9090
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 768m
    user: "65534:65534"

  grafana:
    image: grafana/grafana-oss:12.0.2
    container_name: rtc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA_ADMIN:?defina GRAFANA_SENHA_ADMIN no .env}
      GF_SERVER_ROOT_URL: http://grafana.casa.lan
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rtc.json
      GF_PATHS_DATA: /var/lib/grafana/dados
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./dados/grafana:/var/lib/grafana/dados
    ports:
      - "3000:3000"   # o Traefik da vm-infra (192.168.5.112) publica como grafana.casa.lan
    mem_limit: 384m
    user: "472:472"
