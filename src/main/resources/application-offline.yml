info:
  app:
    version: '@project.version@'

application:
  module: api-regime-geral
  db:
    # Nome do banco PostgreSQL da base de regras (validado pelo DatabaseValidator)
    name: ${DB_NAME:calculadora_pro}
  ibs:
    enabled: true
  memoriacalculo:
    enabled: true
    
spring:
  application:
    name: api-regime-geral
  config:
    activate:
      on-profile: offline
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${application.db.name}
    username: ${DB_USER:calculadora}
    password: ${DB_PASSWORD:}
    hikari:
      # Base somente leitura e quase toda em cache (Caffeine): poucas conexões bastam.
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2
      # Defina DB_SOMENTE_LEITURA=false junto com DB_MIGRAR_NA_INICIALIZACAO=true.
      read-only: ${DB_SOMENTE_LEITURA:true}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
  flyway:
    # Em produção a migração roda fora dos workers (Job/pipeline com usuário de escrita).
    enabled: ${DB_MIGRAR_NA_INICIALIZACAO:false}
    locations: classpath:db/postgres
  threads:
    virtual:
      # Listener do RabbitMQ em threads virtuais: a espera pela confirmação do broker
      # e pelo Redis não ocupa threads de plataforma.
      enabled: true
  lifecycle:
    # Ao escalar para baixo, termina as notas em andamento antes de sair.
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:rtc}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        acknowledge-mode: manual
        # O cálculo usa CPU: consumidores por pod ~ 2 x vCPU; prefetch ~ 1,5 x consumidores.
        concurrency: ${WORKER_CONCORRENCIA:4}
        max-concurrency: ${WORKER_CONCORRENCIA:4}
        prefetch: ${WORKER_PREFETCH:6}
        default-requeue-rejected: false
        observation-enabled: true
        # Iniciado pelo WorkerConfig quando a aplicação está pronta.
        auto-startup: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  task:
    execution:
      pool:
        max-size: 16
        queue-capacity: 100
        keep-alive: "10s"
  devtools:
    add-properties: false
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX       # Formato de data/hora padrão (ISO 8601 com offset)
    serialization:
      write-dates-as-timestamps: false          # Escrever datas como strings ao invés de timestamps
    deserialization:
      adjust-dates-to-context-time-zone: false  # Ajustar datas para o timezone configurado
      fail-on-unknown-properties: false         # Falhar se propriedade desconhecida for encontrada
    property-naming-strategy: LOWER_CAMEL_CASE  # Estratégia de nomenclatura de propriedades
    default-property-inclusion: NON_NULL
  http:
    codecs:
      max-in-memory-size: 500KB
        
logging:
  level:
    root: INFO
    org:
      springframework:
        security: INFO
        web:
          filter: INFO
        data:
          jpa: INFO
          jdbc: INFO
      hibernate:
        orm:
          jdbc:
            bind: INFO
        SQL: INFO
        type: INFO
    com:
      zaxxer:
        hikari: 
          HikariConfig: INFO
    br:
      gov:
        serpro:
          rtc: INFO
          
# Sem API HTTP de negócio: o servidor embutido existe apenas para o Actuator
# (probes de liveness/readiness e métricas Prometheus).
server:
  port: ${MANAGEMENT_PORT:9101}

