management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: "/"
      path-mapping:
        prometheus: "metrics"
  endpoint:
    health:
      # /health/liveness e /health/readiness para os probes do k3s
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_HABILITADO:false}
    sampling:
      probability: ${TRACING_AMOSTRAGEM:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

worker:
  habilitado: ${WORKER_HABILITADO:true}
  fila-entrada: ${WORKER_FILA_ENTRADA:rtc.calculo.entrada}
  exchange-saida: ${WORKER_EXCHANGE_SAIDA:rtc.calculo.out}
  timeout-confirmacao: 10s
  declarar-topologia: ${WORKER_DECLARAR_TOPOLOGIA:false}
  reprocessar-falha-tecnica: true
  # Fila de entrada compartilhada entre empresas; a empresa vem do header x-cnpj,
  # conferido com a routing key nota.<CNPJ>. Resultados saem em resultado.<CNPJ>.
  multi-empresa:
    header-cnpj: x-cnpj
    prefixo-routing-key-entrada: "nota."
    prefixo-routing-key-saida: "resultado."
    exigir-routing-key-da-empresa: ${WORKER_EXIGIR_ROUTING_KEY_DA_EMPRESA:true}
  # Fila de base de cálculo unificada (um item por mensagem): base.<CNPJ> -> resultado-base.<CNPJ>.
  base-calculo:
    habilitado: ${WORKER_BASE_CALCULO_HABILITADO:true}
    fila-entrada: ${WORKER_BASE_CALCULO_FILA_ENTRADA:rtc.basecalculo.entrada}
    prefixo-routing-key-entrada: "base."
    prefixo-routing-key-saida: "resultado-base."
  idempotencia:
    tipo: ${WORKER_IDEMPOTENCIA:redis}
    lease: 5m
    retencao: 2d

