      exposure:
        include: health, prometheus
      base-path: "/"
      path-mapping:
        prometheus: "metrics"

# Os testes não têm broker nem Redis: o worker de filas fica desligado.
worker:
  habilitado: false
  idempotencia:
    tipo: nenhuma
