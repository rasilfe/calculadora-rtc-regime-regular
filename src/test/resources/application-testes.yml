application:
  module: api-regime-geral
  db:
    name: calculadora_nonpro
  ibs:
    enabled: true
  memoriacalculo:
    enabled: true
    
spring:
  application:
    name: api-regime-geral
  config:
    activate:
      on-profile: testes
  # O DataSource dos testes vem do PostgreSQL embarcado (PostgresEmbarcadoTestConfig).
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
  flyway:
    enabled: true
    locations: classpath:db/postgres
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  task:
    execution:
      pool:
        max-size: 16
        queue-capacity: 100
        keep-alive: "10s"
  devtools:
    add-properties: false
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX       # Formato de data/hora padrão (ISO 8601 com offset)
    serialization:
      write-dates-as-timestamps: false          # Escrever datas como strings ao invés de timestamps
    deserialization:
      adjust-dates-to-context-time-zone: false  # Ajustar datas para o timezone configurado
      fail-on-unknown-properties: false         # Falhar se propriedade desconhecida for encontrada
    property-naming-strategy: LOWER_CAMEL_CASE  # Estratégia de nomenclatura de propriedades
    default-property-inclusion: NON_NULL
  http:
    codecs:
      max-in-memory-size: 500KB
        
logging:
  level:
    root: INFO
    org:
      springframework:
        security: INFO
        web:
          filter: INFO
        data:
          jpa: INFO
          jdbc: INFO
      hibernate:
        orm:
          jdbc:
            bind: INFO
        SQL: INFO
        type: INFO
    com:
      zaxxer:
        hikari: 
          HikariConfig: INFO
    br:
      gov:
        serpro:
          rtc: INFO
          
# Sem API HTTP de negócio: o servidor embutido existe apenas para o Actuator
# (probes de liveness/readiness e métricas Prometheus).
server:
  port: ${MANAGEMENT_PORT:9101}

