# Um pod só, com limite de 1,5 GiB (heap de ~1 GiB pelo MaxRAMPercentage=70).
# Rollout derruba o pod antigo antes de subir o novo: não há memória para os dois.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtc-worker
  namespace: rtc
spec:
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      topologySpreadConstraints: null
      containers:
        - name: worker
          env:
            - name: WORKER_CONCORRENCIA
              value: "3"
            - name: WORKER_PREFETCH
              value: "5"
            - name: DB_POOL_MAX
              value: "4"
            # sem Jaeger neste ambiente (não cabe na memória): sem isso o exportador OTLP
            # registra um erro a cada lote de spans
            - name: TRACING_HABILITADO
              value: "false"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 1536Mi
