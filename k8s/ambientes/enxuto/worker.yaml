# Até 2 pods (keda.yaml) de 768 MiB cada. Medido na homologação: o heap vivo do worker
# é de ~70 MB e a memória fora do heap de ~190 MB; com MaxRAMPercentage=60 o heap pode
# chegar a ~460 MB, 6 vezes o necessário, sem passar do limite.
# Rollout com um pod extra (maxSurge: 1) e nenhum fora (maxUnavailable: 0): o deploy não
# para o consumo. Com 2 réplicas ativas o pod extra passa do orçamento de limites por
# alguns segundos, mas o uso real (~450 MB por pod) cabe na VM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtc-worker
  namespace: rtc
spec:
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      topologySpreadConstraints: null
      containers:
        - name: worker
          env:
            - name: WORKER_CONCORRENCIA
              value: "3"
            - name: WORKER_PREFETCH
              value: "5"
            - name: DB_POOL_MAX
              value: "4"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
            # sem Jaeger neste ambiente (não cabe na memória): sem isso o exportador OTLP
            # registra um erro a cada lote de spans
            - name: TRACING_HABILITADO
              value: "false"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 768Mi
