# Topologia do pipeline de cálculo (Messaging Topology Operator).
#
#   empresa --(nota.<CNPJ>)--> rtc.calculo.in --(nota.*)--> rtc.calculo.entrada --> worker
#   worker --(resultado.<CNPJ>)--> rtc.calculo.out --> rtc.calculo.saida.<CNPJ> --> empresa
#   falhas repetidas / mensagens ilegíveis --> rtc.dlx --> *.dlq
#
# A fila de entrada é compartilhada; a de saída é uma por empresa (k8s/empresas).
# Exchanges topic permitem que a topic permission de cada empresa restrinja a routing
# key de publicação ao próprio CNPJ.
#
# Limites, DLX e delivery-limit ficam em Policies (podem ser alterados sem recriar
# as filas); só o tipo quorum é argumento fixo da fila.
apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: rtc
  namespace: rtc
spec:
  name: rtc
  defaultQueueType: quorum
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# ---------------------------------------------------------------- exchanges
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: rtc-calculo-in
  namespace: rtc
spec:
  name: rtc.calculo.in
  vhost: rtc
  type: topic
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: rtc-calculo-out
  namespace: rtc
spec:
  name: rtc.calculo.out
  vhost: rtc
  type: topic
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: rtc-dlx
  namespace: rtc
spec:
  name: rtc.dlx
  vhost: rtc
  type: topic
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# ---------------------------------------------------------------- filas
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: rtc-calculo-entrada
  namespace: rtc
spec:
  name: rtc.calculo.entrada
  vhost: rtc
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: rtc-calculo-entrada-dlq
  namespace: rtc
spec:
  name: rtc.calculo.entrada.dlq
  vhost: rtc
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: rtc-calculo-saida-dlq
  namespace: rtc
spec:
  name: rtc.calculo.saida.dlq
  vhost: rtc
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# ---------------------------------------------------------------- bindings
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: rtc-calculo-entrada
  namespace: rtc
spec:
  vhost: rtc
  source: rtc.calculo.in
  destination: rtc.calculo.entrada
  destinationType: queue
  routingKey: "nota.*"            # nota.<CNPJ> de qualquer empresa
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: rtc-calculo-entrada-dlq
  namespace: rtc
spec:
  vhost: rtc
  source: rtc.dlx
  destination: rtc.calculo.entrada.dlq
  destinationType: queue
  routingKey: rtc.calculo.entrada.dlq
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: rtc-calculo-saida-dlq
  namespace: rtc
spec:
  vhost: rtc
  source: rtc.dlx
  destination: rtc.calculo.saida.dlq
  destinationType: queue
  routingKey: "resultado.#"       # mensagens mortas mantêm resultado.<CNPJ>
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# ---------------------------------------------------------------- base de cálculo
# Fila própria para a base unificada (um item por mensagem): não espera atrás de uma
# rodada de notas. Mesma exchange de entrada, routing key base.<CNPJ>; resultados em
# resultado-base.<CNPJ> -> rtc.basecalculo.saida.<CNPJ> (criada no cadastro da empresa).
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: rtc-basecalculo-entrada
  namespace: rtc
spec:
  name: rtc.basecalculo.entrada
  vhost: rtc
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: rtc-basecalculo-entrada-dlq
  namespace: rtc
spec:
  name: rtc.basecalculo.entrada.dlq
  vhost: rtc
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: rtc-basecalculo-entrada
  namespace: rtc
spec:
  vhost: rtc
  source: rtc.calculo.in
  destination: rtc.basecalculo.entrada
  destinationType: queue
  routingKey: "base.*"            # base.<CNPJ> de qualquer empresa
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: rtc-basecalculo-entrada-dlq
  namespace: rtc
spec:
  vhost: rtc
  source: rtc.dlx
  destination: rtc.basecalculo.entrada.dlq
  destinationType: queue
  routingKey: rtc.basecalculo.entrada.dlq
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: rtc-basecalculo-saida-dlq
  namespace: rtc
spec:
  vhost: rtc
  source: rtc.dlx
  destination: rtc.calculo.saida.dlq
  destinationType: queue
  routingKey: "resultado-base.#"  # mesma DLQ de saída das notas
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# ---------------------------------------------------------------- policies
apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata:
  name: rtc-calculo-entrada
  namespace: rtc
spec:
  name: rtc-calculo-entrada
  vhost: rtc
  pattern: "^rtc\\.calculo\\.entrada$"
  applyTo: queues
  priority: 10
  definition:
    dead-letter-exchange: rtc.dlx
    dead-letter-routing-key: rtc.calculo.entrada.dlq
    dead-letter-strategy: at-least-once   # exige overflow=reject-publish
    overflow: reject-publish              # fila cheia recusa a publicação; nunca descarta
    max-length: 200000                    # ~25 rodadas de 8.000 notas
    delivery-limit: 5                     # 6ª entrega vai para a DLQ
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata:
  name: rtc-basecalculo-entrada
  namespace: rtc
spec:
  name: rtc-basecalculo-entrada
  vhost: rtc
  pattern: "^rtc\\.basecalculo\\.entrada$"
  applyTo: queues
  priority: 10
  definition:
    dead-letter-exchange: rtc.dlx
    dead-letter-routing-key: rtc.basecalculo.entrada.dlq
    dead-letter-strategy: at-least-once
    overflow: reject-publish
    max-length: 200000
    delivery-limit: 5
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata:
  name: rtc-calculo-saida-empresas
  namespace: rtc
spec:
  name: rtc-calculo-saida-empresas
  vhost: rtc
  # Filas de saída por empresa, das notas e da base de cálculo:
  # rtc.calculo.saida.<CNPJ> e rtc.basecalculo.saida.<CNPJ> (numérico ou alfanumérico)
  pattern: "^rtc\\.(calculo|basecalculo)\\.saida\\.[0-9A-Z]{12}[0-9]{2}$"
  applyTo: queues
  priority: 10
  definition:
    dead-letter-exchange: rtc.dlx
    # sem dead-letter-routing-key: a mensagem morta mantém resultado.<CNPJ>
    dead-letter-strategy: at-least-once
    overflow: reject-publish              # fila cheia recusa: a nota fica na entrada até a empresa consumir
    max-length: 100000                    # por empresa
    delivery-limit: 5
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# ---------------------------------------------------------------- usuários
# O operador gera o Secret "<nome>-user-credentials" (chaves username/password).
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: rtc-worker
  namespace: rtc
spec:
  tags: []
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: rtc-worker
  namespace: rtc
spec:
  vhost: rtc
  userReference:
    name: rtc-worker
  permissions:
    configure: "^$"                          # topologia é do operador
    write: "^rtc\\.calculo\\.out$"
    read: "^rtc\\.(calculo|basecalculo)\\.entrada$"
  rabbitmqClusterReference:
    name: rtc-rabbit
---
# Usuário do KEDA: só lê a profundidade das filas pela API de gerenciamento.
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: rtc-keda
  namespace: rtc
spec:
  tags:
    - monitoring
  rabbitmqClusterReference:
    name: rtc-rabbit
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: rtc-keda
  namespace: rtc
spec:
  vhost: rtc
  userReference:
    name: rtc-keda
  permissions:
    configure: "^$"
    write: "^$"
    read: "^$"
  rabbitmqClusterReference:
    name: rtc-rabbit
