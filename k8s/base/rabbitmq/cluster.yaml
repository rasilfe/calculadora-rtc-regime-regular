# Cluster RabbitMQ gerenciado pelo RabbitMQ Cluster Operator.
# Pré-requisitos no k3s: Cluster Operator e Messaging Topology Operator instalados.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rtc-rabbit
  namespace: rtc
spec:
  replicas: 3
  # 4.2+: o Cluster Operator 2.23+ usa na startup probe o endpoint
  # /api/health/checks/reached-target-cluster-size, que não existe na 4.1 (pod reinicia em loop).
  image: rabbitmq:4.2-management
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 2Gi
  persistence:
    storageClassName: local-path
    storage: 20Gi
  rabbitmq:
    additionalConfig: |
      vm_memory_high_watermark.relative = 0.6
      disk_free_limit.absolute = 2GB
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rtc-rabbit
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rtc-rabbit
  namespace: rtc
spec:
  # Mantém o quórum (2 de 3) durante manutenção de nós.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rtc-rabbit
